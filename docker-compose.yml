name: mangan-ai

x-app: &app
  build: .
  env_file: [.env]
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: moil_intelligence
      POSTGRES_USER: moil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moil_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moil -d moil_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://moil:${POSTGRES_PASSWORD:-moil_dev_password}@db:5432/moil_intelligence
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_reference_data.py"]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://moil:${POSTGRES_PASSWORD:-moil_dev_password}@db:5432/moil_intelligence
      MANGAN_ENV: production
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py", "--url", "http://127.0.0.1:8000"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    <<: *app
    environment:
      FRONTEND_API_URL: http://api:8000
    command: ["streamlit", "run", "apps/frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
